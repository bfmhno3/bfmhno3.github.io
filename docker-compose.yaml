services:
  jekyll:
    build:
      context: .
      args:
        BUNDLER_VERSION: "2.6.9"
    userns_mode: keep-id
    command:
      - sh
      - -ec
      - |
        if [ -n "$${RUBYGEMS_MIRROR:-}" ]; then
          bundle config set --global mirror.https://rubygems.org/ "$${RUBYGEMS_MIRROR}"
        else
          bundle config unset --global mirror.https://rubygems.org/
        fi
        bundle check || bundle install
        exec bundle exec jekyll serve --watch --force_polling --future --host 0.0.0.0
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - .:/srv/jekyll
      - bundle_cache_ruby_3_3:/usr/local/bundle
    environment:
      BUNDLE_PATH: /usr/local/bundle
      RUBYGEMS_MIRROR: ${RUBYGEMS_MIRROR:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bundle_cache_ruby_3_3:
