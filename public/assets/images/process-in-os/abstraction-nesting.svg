<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-label="进程、线程与协程的包含关系">
  <rect width="940" height="460" fill="#ffffff"/>
  <style>
    text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',system-ui,sans-serif; }
    .b { font-size: 15px; font-weight: 600; fill: #1f2937; }
    .t { font-size: 13px; font-weight: 600; fill: #334155; }
    .s { font-size: 11.5px; fill: #6b7280; }
  </style>

  <rect x="30" y="56" width="880" height="340" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="b" x="50" y="82">进程：独立地址空间 + 资源配额</text>

  <rect x="60" y="100" width="390" height="276" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text class="t" x="76" y="126">线程 1：私有栈、寄存器、TLS</text>
  <rect x="84" y="144" width="160" height="86" rx="8" fill="#d1fae5" stroke="#34d399"/>
  <text class="t" x="164" y="184" text-anchor="middle">协程 A</text>
  <text class="s" x="164" y="206" text-anchor="middle">堆上的状态机帧</text>
  <rect x="266" y="144" width="160" height="86" rx="8" fill="#d1fae5" stroke="#34d399"/>
  <text class="t" x="346" y="184" text-anchor="middle">协程 B</text>
  <text class="s" x="346" y="206" text-anchor="middle">堆上的状态机帧</text>
  <text class="s" x="76" y="290">协程由运行时（asyncio / tokio / 执行器）调度</text>
  <text class="s" x="76" y="312">同一个线程里的协程轮流推进，不并行</text>
  <text class="s" x="76" y="348">线程之间由内核调度，可以真并行</text>

  <rect x="490" y="100" width="390" height="276" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text class="t" x="506" y="126">线程 2：私有栈、寄存器、TLS</text>
  <rect x="514" y="144" width="160" height="86" rx="8" fill="#d1fae5" stroke="#34d399"/>
  <text class="t" x="594" y="184" text-anchor="middle">协程 C</text>
  <text class="s" x="594" y="206" text-anchor="middle">堆上的状态机帧</text>
  <rect x="696" y="144" width="160" height="86" rx="8" fill="#d1fae5" stroke="#34d399"/>
  <text class="t" x="776" y="184" text-anchor="middle">协程 D</text>
  <text class="s" x="776" y="206" text-anchor="middle">堆上的状态机帧</text>
  <text class="s" x="506" y="290">多个线程共享同一个进程的地址空间</text>
  <text class="s" x="506" y="312">所以协程之间可以用指针直接传数据</text>

  <text class="s" x="30" y="428">内核调度进程与线程；线程内部的协程由用户态运行时调度。协程切换不需要进内核。</text>
</svg>
