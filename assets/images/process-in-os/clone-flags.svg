<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="fork 与 pthread_create 都是 clone">
  <rect width="940" height="300" fill="#ffffff"/>
  <style>
    text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',system-ui,sans-serif; }
    .b { font-size: 14px; font-weight: 600; fill: #1f2937; }
    .t { font-size: 12.5px; fill: #374151; }
    .s { font-size: 11.5px; fill: #6b7280; }
    .m { font-family: ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace; font-size: 11px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.4" orient="auto"><path d="M0,0 L8,3.4 L0,6.8 z" fill="#9ca3af"/></marker>
  </defs>

  <rect x="40" y="50" width="200" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text class="b" x="140" y="86" text-anchor="middle">fork()</text>

  <path d="M240,80 L420,80" fill="none" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="420" y="50" width="480" height="60" rx="8" fill="#e0e7ff" stroke="#818cf8"/>
  <text class="b" x="440" y="76">新进程：独立 mm_struct</text>
  <text class="t" x="440" y="98">文件表、信号处理、地址空间都各有一份</text>

  <rect x="420" y="122" width="480" height="30" rx="6" fill="#fffbeb" stroke="#fbbf24"/>
  <text class="m" x="660" y="142" text-anchor="middle">CLONE_VM | CLONE_FS | CLONE_FILES | CLONE_SIGHAND | CLONE_THREAD</text>

  <rect x="40" y="168" width="200" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text class="b" x="140" y="204" text-anchor="middle">pthread_create()</text>

  <path d="M240,198 L420,198" fill="none" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="420" y="168" width="480" height="60" rx="8" fill="#d1fae5" stroke="#34d399"/>
  <text class="b" x="440" y="194">新线程：共享 mm_struct</text>
  <text class="t" x="440" y="216">共享文件表与信号处理，只私有栈和寄存器</text>

  <text class="s" x="40" y="268">Linux 里进程和线程都是 task_struct，区别只在 clone 传了哪些标志位。</text>
</svg>
