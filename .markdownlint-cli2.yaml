config:
  default: true
  MD004:
    style: dash
  MD009:
    br_spaces: 2
  MD013: false
  MD024:
    siblings_only: true
  MD033:
    allowed_elements:
      - br
      - details
      - div
      - i
      - img
      - kbd
      - li
      - ol
      - source
      - span
      - strong
      - summary
      - video
  MD041: false
globs:
  - "#_site/**"
  - "#node_modules/**"
  - "#vendor/**"
